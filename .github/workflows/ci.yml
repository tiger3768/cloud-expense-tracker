name: Expense Tracker CI

on:
  push:
    branches:
      - "feature/**"

jobs:
  build:
    name: Build and Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Run Tests
        run: mvn clean verify
