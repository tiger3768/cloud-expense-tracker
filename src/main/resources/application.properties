spring.application.name=expense-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.refresh-token.expiration-days=${REFRESH_TOKEN_EDATE}
app.jwt.expiration-ms=${ACCESS_TOKEN_EMS}
app.email-verification.expiration-hours=${VERIFICATION_TOKEN_EHR}
app.password-reset.expiration-hours=${PASSWORD_RESET_TOKEN_EHR}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.contact.email=${APP_CONTACT_EMAIL}